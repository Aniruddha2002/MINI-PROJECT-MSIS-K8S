apiVersion: v1
kind: ServiceAccount
metadata:
  name: secure-health-check
  namespace: security-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-health-check
  namespace: security-lab
  labels:
    app: secure-health-check
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-health-check
  template:
    metadata:
      labels:
        app: secure-health-check
    spec:
      serviceAccountName: secure-health-check
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: health-check
          image: madhuakula/k8s-goat-health-check
          ports:
            - containerPort: 80
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "20m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secure-health-check-default-deny
  namespace: security-lab
spec:
  podSelector:
    matchLabels:
      app: secure-health-check
  policyTypes:
    - Ingress
    - Egress