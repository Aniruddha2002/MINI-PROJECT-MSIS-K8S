apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-internal-proxy
  namespace: security-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-internal-proxy
  template:
    metadata:
      labels:
        app: secure-internal-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: internal-api
        image: madhuakula/k8s-goat-internal-api
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 30m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
      - name: info-app
        image: madhuakula/k8s-goat-info-app
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: 30m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: secure-internal-proxy-api
  namespace: security-lab
spec:
  selector:
    app: secure-internal-proxy
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: secure-internal-proxy-info
  namespace: security-lab
spec:
  selector:
    app: secure-internal-proxy
  ports:
  - port: 5000
    targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secure-internal-proxy-default-deny
  namespace: security-lab
spec:
  podSelector:
    matchLabels:
      app: secure-internal-proxy
  policyTypes:
  - Ingress
  - Egress
