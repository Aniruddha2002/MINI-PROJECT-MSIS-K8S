apiVersion: v1
kind: ServiceAccount
metadata:
  name: secure-build-code
  namespace: security-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-build-code
  namespace: security-lab
  labels:
    app: secure-build
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-build
  template:
    metadata:
      labels:
        app: secure-build
    spec:
      serviceAccountName: secure-build-code
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: build-code
          image: madhuakula/k8s-goat-build-code
          ports:
            - containerPort: 3000
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "20m"
              memory: "50Mi"
            limits:
              cpu: "100m"
              memory: "100Mi"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secure-build-code-default-deny
  namespace: security-lab
spec:
  podSelector:
    matchLabels:
      app: secure-build
  policyTypes:
    - Ingress
    - Egress